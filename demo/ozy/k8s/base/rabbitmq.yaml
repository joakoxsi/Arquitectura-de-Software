# Broker PROPIO de Ozy, para publicar sus eventos (chat.translation.created,
# chat.glossary.*) en el exchange `chat`. El chat base del clúster no tiene broker
# (su `messages` no publica eventos), así que Ozy no lo comparte con nadie.
# Sin volumen persistente: la cuota permite un solo PVC (lo usa MongoDB) y los
# eventos de Ozy son notificaciones, su registro durable está en MongoDB.
apiVersion: v1
kind: ConfigMap
metadata:
  name: ozy-rabbitmq-config
  labels:
    app.kubernetes.io/name: ozy
    app.kubernetes.io/component: broker
    app.kubernetes.io/part-of: chat
data:
  90-ozy.conf: |
    # Memoria según el límite del contenedor (RabbitMQ no lee el cgroup por sí solo).
    total_memory_available_override_value = 320MB
    vm_memory_high_watermark.relative = 0.6
    disk_free_limit.absolute = 50MB
---
apiVersion: v1
kind: Service
metadata:
  name: ozy-rabbitmq
  labels:
    app.kubernetes.io/name: ozy
    app.kubernetes.io/component: broker
    app.kubernetes.io/part-of: chat
spec:
  selector:
    app.kubernetes.io/name: ozy
    app.kubernetes.io/component: broker
  ports:
    - name: amqp
      port: 5672
      targetPort: amqp
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ozy-rabbitmq
  labels:
    app.kubernetes.io/name: ozy
    app.kubernetes.io/component: broker
    app.kubernetes.io/part-of: chat
spec:
  replicas: 1
  strategy:
    type: Recreate   # un solo broker; nunca dos a la vez
  selector:
    matchLabels:
      app.kubernetes.io/name: ozy
      app.kubernetes.io/component: broker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ozy
        app.kubernetes.io/component: broker
        app.kubernetes.io/part-of: chat
    spec:
      hostname: ozy-rabbitmq   # nombre de nodo estable (rabbit@ozy-rabbitmq)
      securityContext:
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: rabbitmq
          image: rabbitmq:3.13-alpine
          ports:
            - name: amqp
              containerPort: 5672
          env:
            # Credenciales desde el Secret creado por el CI (secret OZY_RABBITMQ_PASSWORD).
            - name: RABBITMQ_DEFAULT_USER
              valueFrom:
                secretKeyRef: {name: ozy-secrets, key: RABBITMQ_DEFAULT_USER}
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef: {name: ozy-secrets, key: RABBITMQ_DEFAULT_PASS}
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 320Mi
          startupProbe:
            tcpSocket:
              port: amqp
            periodSeconds: 3
            failureThreshold: 40   # Erlang tarda en arrancar con poca CPU
          readinessProbe:
            tcpSocket:
              port: amqp
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: amqp
            periodSeconds: 20
            failureThreshold: 3
          volumeMounts:
            - name: data
              mountPath: /var/lib/rabbitmq
            - name: config
              mountPath: /etc/rabbitmq/conf.d/90-ozy.conf
              subPath: 90-ozy.conf
      volumes:
        - name: data
          emptyDir: {}
        - name: config
          configMap:
            name: ozy-rabbitmq-config
---
# Solo los pods de Ozy (API y Jobs de prueba) hablan con su broker.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ozy-rabbitmq
  labels:
    app.kubernetes.io/name: ozy
    app.kubernetes.io/part-of: chat
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: ozy
      app.kubernetes.io/component: broker
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: ozy
      ports:
        - port: 5672

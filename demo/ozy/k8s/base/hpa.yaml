apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ozy
  labels:
    app.kubernetes.io/name: ozy
    app.kubernetes.io/part-of: chat
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ozy
  # Mínimo 2: tolera la caída de un pod sin perder servicio (ver pdb.yaml).
  minReplicas: 2
  maxReplicas: 4   # tope que permite la cuota del namespace (ver k8s/README.md)
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60   # % de requests.cpu (50m) => escala sobre ~30m por pod
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Pods
          value: 2           # hasta +2 pods
          periodSeconds: 30  # cada 30 s
    scaleDown:
      # 120 s en vez de los 300 s por defecto: evita oscilar, pero deja ver la
      # bajada dentro de la prueba de escalamiento.
      stabilizationWindowSeconds: 120
      policies:
        - type: Pods
          value: 1
          periodSeconds: 30

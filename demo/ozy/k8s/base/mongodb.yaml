# Base de datos PROPIA de Ozy (equivale a `ozy-mongodb` del compose). Ozy no usa
# las bases del core: cada servicio es dueño de sus datos.
apiVersion: v1
kind: Service
metadata:
  name: ozy-mongodb
  labels:
    app.kubernetes.io/name: ozy
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: chat
spec:
  clusterIP: None   # headless: DNS estable para el StatefulSet
  selector:
    app.kubernetes.io/name: ozy
    app.kubernetes.io/component: database
  ports:
    - name: mongodb
      port: 27017
      targetPort: mongodb
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ozy-mongodb
  labels:
    app.kubernetes.io/name: ozy
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: chat
spec:
  serviceName: ozy-mongodb
  replicas: 1   # el estado no escala con el HPA; la capacidad escala en la API
  selector:
    matchLabels:
      app.kubernetes.io/name: ozy
      app.kubernetes.io/component: database
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ozy
        app.kubernetes.io/component: database
        app.kubernetes.io/part-of: chat
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999      # usuario mongodb de la imagen oficial
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mongodb
          image: mongo:7
          args: ["--bind_ip_all", "--wiredTigerCacheSizeGB", "0.25"]
          ports:
            - name: mongodb
              containerPort: 27017
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 250m
              memory: 448Mi
          readinessProbe:
            exec:
              command: ["mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket:
              port: mongodb
            initialDelaySeconds: 20
            periodSeconds: 15
          volumeMounts:
            - name: data
              mountPath: /data/db
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
---
# Solo los pods de la API de Ozy pueden hablar con su MongoDB.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ozy-mongodb
  labels:
    app.kubernetes.io/name: ozy
    app.kubernetes.io/part-of: chat
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: ozy
      app.kubernetes.io/component: database
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: ozy
              app.kubernetes.io/component: api
      ports:
        - port: 27017

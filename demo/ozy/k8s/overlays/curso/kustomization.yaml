# Overlay para el clúster común del curso.
# El CI (.github/workflows/ozy-k8s.yml) reemplaza `namespace` y `newTag` en cada deploy.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: grupo-ozy            # <- namespace asignado al grupo
resources:
  - ../../base
images:
  - name: ozy
    newName: ghcr.io/joakoxsi/ozy
    newTag: latest
# Direcciones del chat base (solo lectura: Ozy no lo modifica). core.env NO está en
# el repo: se crea desde core.env.example (local) o desde secrets de GitHub (CI).
configMapGenerator:
  - name: ozy-config
    behavior: merge
    envs:
      - core.env
generatorOptions:
  disableNameSuffixHash: true
# El rol del grupo en el clúster del curso no puede crear PodDisruptionBudgets ni
# NetworkPolicies (`kubectl auth can-i --list`). Se quitan solo aquí; la base los
# conserva para clústeres propios. El aislamiento lo da la NetworkPolicy del curso
# `conexiones-del-grupo`: solo entran pods del mismo namespace, `infraestructura`
# y `servicios-base`, así que otros grupos no llegan a MongoDB ni a RabbitMQ.
patches:
  - patch: |-
      $patch: delete
      apiVersion: policy/v1
      kind: PodDisruptionBudget
      metadata:
        name: ozy
  - patch: |-
      $patch: delete
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: ozy-mongodb
  - patch: |-
      $patch: delete
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: ozy-rabbitmq

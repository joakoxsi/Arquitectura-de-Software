[pytest]
testpaths = tests
pythonpath = .
# La integración necesita Docker Compose: se pide explícitamente con
# `pytest -m integration` (el último -m manda) o con scripts/integracion.sh.
addopts = -m "not integration"
markers =
    unit: lógica interna de Ozy (detector, ACL, consumidor, sincronizador)
    service: API de Ozy con TestClient y BD de pruebas aislada
    contract: contratos con el chat base (JSON Schema en tests/contract/contracts)
    integration: flujo con users, channels y messages reales en Docker Compose

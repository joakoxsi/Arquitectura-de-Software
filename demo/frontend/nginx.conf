server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # La interfaz solo habla con el API Gateway: GraphQL en /graphql (REST en /api/).
  location /graphql {
    proxy_pass http://gateway:8000;
    proxy_set_header Host $host;
  }

  location /api/ {
    proxy_pass http://gateway:8000;
    proxy_set_header Host $host;
  }

  location / {
    try_files $uri /index.html;
  }
}

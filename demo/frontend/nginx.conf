server {
  # 8080: la imagen nginx-unprivileged no corre como root (no puede usar el 80).
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;

  # La interfaz solo habla con el API Gateway: GraphQL en /graphql (REST en /api/).
  location /graphql {
    proxy_pass http://gateway:8000;
    proxy_set_header Host $host;
  }

  location /api/ {
    proxy_pass http://gateway:8000;
    proxy_set_header Host $host;
  }

  # Probes de Kubernetes: responde nginx mismo, sin depender del gateway.
  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location / {
    try_files $uri /index.html;
  }
}

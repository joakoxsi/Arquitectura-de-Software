# Entorno de la prueba de integración de Ozy (ozy/tests/integration).
#
# Solo levanta lo que el flujo necesita: el chat base (users, channels, messages),
# Ozy, RabbitMQ y una MongoDB por servicio. Sin volúmenes (cada corrida parte de
# cero), con su propia red y con puertos distintos a docker-compose.yaml, así que
# puede correr junto al entorno de desarrollo.
#
#   ozy/scripts/integracion.sh          # levanta, prueba y destruye
#
# o a mano, desde demo/:
#
#   docker compose -f docker-compose.test.yaml -p ozy-integracion up -d --build --wait
#   (cd ozy && python -m pytest -m integration tests/integration -v)
#   docker compose -f docker-compose.test.yaml -p ozy-integracion down -v
#
# La contraseña del broker es solo para este entorno local y efímero.

x-python-health: &python-health
  interval: 2s
  timeout: 3s
  retries: 30
  start_period: 3s

x-mongo: &mongo
  image: mongo:7
  healthcheck:
    test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
    interval: 2s
    timeout: 5s
    retries: 30
    start_period: 5s

services:
  users:
    build: ./users
    ports: ["18001:8000"]
    environment:
      MONGODB_URL: mongodb://users-mongodb:27017
    depends_on:
      users-mongodb: { condition: service_healthy }
    healthcheck:
      <<: *python-health
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]

  channels:
    build: ./channels
    ports: ["18002:8000"]
    environment:
      MONGODB_URL: mongodb://channels-mongodb:27017
    depends_on:
      channels-mongodb: { condition: service_healthy }
    healthcheck:
      <<: *python-health
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]

  messages:
    build: ./messages
    ports: ["18003:8000"]
    environment:
      USERS_URL: http://users:8000
      CHANNELS_URL: http://channels:8000
      MONGODB_URL: mongodb://messages-mongodb:27017
      RABBITMQ_URL: amqp://chat:${OZY_TEST_RABBITMQ_PASSWORD:-integracion-local}@rabbitmq:5672/
    depends_on:
      messages-mongodb: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      users: { condition: service_healthy }
      channels: { condition: service_healthy }
    healthcheck:
      <<: *python-health
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]

  ozy:
    build: ./ozy
    ports: ["18004:8000"]
    environment:
      USERS_URL: http://users:8000
      MONGODB_URL: mongodb://ozy-mongodb:27017
      RABBITMQ_URL: amqp://chat:${OZY_TEST_RABBITMQ_PASSWORD:-integracion-local}@rabbitmq:5672/
    depends_on:
      ozy-mongodb: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      users: { condition: service_healthy }
    healthcheck:
      <<: *python-health
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=2)"]

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "18672:5672"     # AMQP: la prueba escucha los eventos que publica Ozy
      - "18673:15672"    # API de administración: la prueba espera la cola de Ozy
    environment:
      RABBITMQ_DEFAULT_USER: chat
      RABBITMQ_DEFAULT_PASS: ${OZY_TEST_RABBITMQ_PASSWORD:-integracion-local}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 3s
      timeout: 5s
      retries: 40

  users-mongodb: *mongo
  channels-mongodb: *mongo
  messages-mongodb: *mongo
  ozy-mongodb: *mongo

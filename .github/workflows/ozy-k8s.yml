# CI/CD de Ozy, API Gateway e interfaz web:
# tests -> 3 imágenes en GHCR -> deploy al clúster del curso -> prueba integrada.
#
# Configuración (Settings del repo -> Secrets and variables -> Actions):
#   secrets.KUBECONFIG        kubeconfig con acceso al namespace del grupo (texto o base64;
#                             nunca se versiona, ver .gitignore de la raíz)
#   secrets.OZY_USERS_URL     URL interna de users     (no se guarda en el repo)
#   secrets.OZY_CHANNELS_URL  URL interna de channels  (no se guarda en el repo)
#   secrets.OZY_MESSAGES_URL  URL interna de messages  (no se guarda en el repo)
#   secrets.OZY_RABBITMQ_PASSWORD  clave del RabbitMQ propio de Ozy (inventarla, larga y al azar)
#   vars.OZY_NAMESPACE        opcional: namespace del grupo (def. el que trae el kubeconfig)
#   vars.CORE_NAMESPACE       opcional: namespace del chat base (def. servicios-base), solo para la evidencia
#   secrets.OZY_SEARCH_URL / OZY_SEARCH_HOST / OZY_SUMMARIES_URL
#                             opcionales: capacidades de otros grupos que usa el gateway
#   vars.INGRESS_HOST         opcional: host público de la interfaz (sin él no se crea Ingress)
#   vars.INGRESS_CLASS        opcional: IngressClass del clúster (def. traefik)
# Sin KUBECONFIG el workflow igual corre tests y publica la imagen; solo omite el deploy.

name: ozy-k8s

on:
  push:
    branches: [main, github-actions]
    paths:
      - "demo/ozy/**"
      - "demo/gateway/**"
      - "demo/frontend/**"
      - ".github/workflows/ozy-k8s.yml"
  pull_request:
    paths:
      - "demo/ozy/**"
      - "demo/gateway/**"
      - "demo/frontend/**"
  workflow_dispatch:
    inputs:
      escalamiento:
        description: "Correr también la prueba de escalamiento (~10 min)"
        type: boolean
        default: false

concurrency:
  group: ozy-deploy   # un solo deploy a la vez al namespace, venga de la rama que venga
  cancel-in-progress: false # nunca cortar un deploy a medias

env:
  OZY_DIR: demo/ozy

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: demo/ozy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: demo/ozy/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -v
      - name: Tests del API Gateway
        working-directory: demo/gateway
        run: |
          pip install -r requirements-dev.txt
          python -m pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: demo/frontend/package-lock.json
      - name: Compilar la interfaz web
        working-directory: demo/frontend
        run: |
          npm ci
          npm run build
      - name: Validar manifiestos (render de kustomize)
        run: |
          cp k8s/overlays/curso/core.env.example k8s/overlays/curso/core.env
          kubectl kustomize k8s/overlays/curso > /dev/null
          kubectl kustomize k8s/pruebas > /dev/null
          kubectl kustomize ../frontend/k8s/ingress > /dev/null

  image:
    needs: test
    # Solo main y github-actions publican y despliegan. Ni un PR (a develop o a main)
    # ni un workflow_dispatch lanzado desde otra rama llegan al clúster: ahí solo hay tests.
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/github-actions')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - {name: ozy, context: demo/ozy}
          - {name: ozy-gateway, context: demo/gateway}
          - {name: ozy-frontend, context: demo/frontend}
    steps:
      - uses: actions/checkout@v4
      - id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.name }}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ${{ steps.name.outputs.image }}:${{ github.sha }}
            ${{ steps.name.outputs.image }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    needs: image
    runs-on: ubuntu-latest
    environment: curso
    env:
      # NS se fija en "Configurar acceso al clúster": vars.OZY_NAMESPACE o, si no
      # está, el namespace que trae el kubeconfig del curso.
      NS_VAR: ${{ vars.OZY_NAMESPACE }}
      CORE_NS: ${{ vars.CORE_NAMESPACE || 'servicios-base' }}
      # Las 3 imágenes (ozy, ozy-gateway, ozy-frontend) viven en el mismo registro.
      REGISTRY: ghcr.io/${{ github.repository_owner }}
      HAS_KUBECONFIG: ${{ secrets.KUBECONFIG != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Aviso si falta secrets.KUBECONFIG (se salta si existe)
        if: env.HAS_KUBECONFIG != 'true'
        run: echo "::warning::Falta secrets.KUBECONFIG; se omite el deploy."
      - uses: azure/setup-kubectl@v4
        if: env.HAS_KUBECONFIG == 'true'
      - name: Configurar acceso al clúster
        if: env.HAS_KUBECONFIG == 'true'
        env:
          # Por env y no interpolado en el script: el shell no expande su contenido.
          KUBECONFIG_DATA: ${{ secrets.KUBECONFIG }}
        run: |
          mkdir -p ~/.kube
          umask 077
          # Acepta el kubeconfig en base64 (recomendado) o en texto plano, YAML o JSON.
          # La validación la hace kubectl, que entiende ambos formatos.
          valid() { kubectl config view > /dev/null 2>&1 && [ -n "$(kubectl config current-context 2>/dev/null)" ]; }
          printf '%s' "$KUBECONFIG_DATA" | tr -d ' \r\n' | base64 -d > ~/.kube/config 2>/dev/null || true
          if ! valid; then
            printf '%s\n' "$KUBECONFIG_DATA" > ~/.kube/config
          fi
          valid || { echo "::error::secrets.KUBECONFIG no es un kubeconfig válido (ni en base64 ni en texto)"; exit 1; }
          echo "Contexto: $(kubectl config current-context)"
          kubectl version
          NS="${NS_VAR:-$(kubectl config view --minify -o jsonpath='{..namespace}')}"
          [ -n "$NS" ] || { echo "::error::Sin namespace: define vars.OZY_NAMESPACE"; exit 1; }
          echo "NS=$NS" >> "$GITHUB_ENV"
          echo "Namespace de despliegue: $NS"
          kubectl auth can-i create deployments -n "$NS"
          kubectl auth can-i create horizontalpodautoscalers.autoscaling -n "$NS"
      - name: Fijar namespace, imágenes (por commit) y direcciones del core
        if: env.HAS_KUBECONFIG == 'true'
        working-directory: demo/ozy/k8s
        env:
          USERS_URL: ${{ secrets.OZY_USERS_URL }}
          CHANNELS_URL: ${{ secrets.OZY_CHANNELS_URL }}
          MESSAGES_URL: ${{ secrets.OZY_MESSAGES_URL }}
          SEARCH_URL: ${{ secrets.OZY_SEARCH_URL }}
          SEARCH_HOST: ${{ secrets.OZY_SEARCH_HOST }}
          SUMMARIES_URL: ${{ secrets.OZY_SUMMARIES_URL }}
        run: |
          REGISTRY="${REGISTRY,,}"   # GHCR exige minúsculas
          for f in overlays/curso/kustomization.yaml pruebas/kustomization.yaml \
                   ../../frontend/k8s/ingress/kustomization.yaml; do
            sed -i -e "s|^namespace: .*|namespace: ${NS}|" \
                   -e "s|newName: ghcr.io/[^/]*/|newName: ${REGISTRY}/|" \
                   -e "s|newTag: .*|newTag: ${GITHUB_SHA}|" "$f"
          done
          # Las URLs del core vienen de secrets: se escriben solo en el runner (efímero)
          # y nunca se imprimen.
          for v in USERS_URL CHANNELS_URL MESSAGES_URL; do
            [ -n "${!v}" ] || { echo "::error::Falta el secret OZY_${v}"; exit 1; }
          done
          printf 'USERS_URL=%s\nCHANNELS_URL=%s\nMESSAGES_URL=%s\n' \
            "$USERS_URL" "$CHANNELS_URL" "$MESSAGES_URL" > overlays/curso/core.env
          # Opcionales: solo se agregan si el secret existe (si no, el gateway usa su
          # valor por defecto y esa capacidad aparece como caída en la interfaz).
          for v in SEARCH_URL SEARCH_HOST SUMMARIES_URL; do
            [ -z "${!v}" ] || printf '%s=%s\n' "$v" "${!v}" >> overlays/curso/core.env
          done
      - name: Secret del broker propio de Ozy
        if: env.HAS_KUBECONFIG == 'true'
        env:
          RABBITMQ_PASSWORD: ${{ secrets.OZY_RABBITMQ_PASSWORD }}
        run: |
          [ -n "$RABBITMQ_PASSWORD" ] || { echo "::error::Falta el secret OZY_RABBITMQ_PASSWORD"; exit 1; }
          # La clave va al broker (DEFAULT_*) y a Ozy (RABBITMQ_URL); nunca se imprime.
          PASS_URL=$(python3 -c 'import os,urllib.parse;print(urllib.parse.quote(os.environ["RABBITMQ_PASSWORD"],safe=""))')
          kubectl -n "$NS" create secret generic ozy-secrets \
            --from-literal=RABBITMQ_DEFAULT_USER=ozy \
            --from-literal=RABBITMQ_DEFAULT_PASS="$RABBITMQ_PASSWORD" \
            --from-literal=RABBITMQ_URL="amqp://ozy:${PASS_URL}@ozy-rabbitmq:5672/" \
            --dry-run=client -o yaml | kubectl apply -f -
      - name: Aplicar manifiestos de Ozy (no toca el core)
        if: env.HAS_KUBECONFIG == 'true'
        run: kubectl apply -k "$OZY_DIR/k8s/overlays/curso"
      - name: Esperar el rollout
        if: env.HAS_KUBECONFIG == 'true'
        run: |
          kubectl -n "$NS" rollout status statefulset/ozy-mongodb --timeout=180s
          kubectl -n "$NS" rollout status deployment/ozy-rabbitmq --timeout=180s
          kubectl -n "$NS" rollout status deployment/ozy --timeout=240s
          kubectl -n "$NS" rollout status deployment/gateway --timeout=180s
          kubectl -n "$NS" rollout status deployment/frontend --timeout=180s
          kubectl -n "$NS" get deploy,hpa,pods -l app.kubernetes.io/part-of=chat -o wide
      - name: Ingress de la interfaz (solo si hay vars.INGRESS_HOST)
        if: env.HAS_KUBECONFIG == 'true' && vars.INGRESS_HOST != ''
        env:
          INGRESS_HOST: ${{ vars.INGRESS_HOST }}
          INGRESS_CLASS: ${{ vars.INGRESS_CLASS || 'traefik' }}
        run: |
          sed -i -e "s|HOST_PLACEHOLDER|${INGRESS_HOST}|" -e "s|CLASS_PLACEHOLDER|${INGRESS_CLASS}|" \
            demo/frontend/k8s/ingress/ingress.yaml
          kubectl apply -k demo/frontend/k8s/ingress
          kubectl -n "$NS" get ingress frontend
      - name: Verificar autoscaling (HPA con métricas)
        if: env.HAS_KUBECONFIG == 'true'
        run: |
          # Sin metrics-server el HPA queda en <unknown> y nunca escala.
          for i in $(seq 1 24); do
            CPU=$(kubectl -n "$NS" get hpa ozy -o jsonpath='{.status.currentMetrics[0].resource.current.averageUtilization}')
            if [ -n "$CPU" ]; then
              echo "HPA activo: CPU ${CPU}% (objetivo 60%)"
              kubectl -n "$NS" get hpa ozy
              exit 0
            fi
            sleep 5
          done
          kubectl -n "$NS" describe hpa ozy | tail -20
          echo "::error::El HPA no recibe métricas de CPU (¿falta metrics-server?)"
          exit 1
      - name: Diagnóstico si el rollout falla
        if: failure() && env.HAS_KUBECONFIG == 'true'
        run: |
          kubectl -n "$NS" describe deploy ozy | tail -30
          kubectl -n "$NS" get events --sort-by=.lastTimestamp | tail -30
          kubectl -n "$NS" logs -l app.kubernetes.io/component=api --tail=50 --prefix || true
          kubectl -n "$NS" logs deploy/gateway --tail=30 || true
          kubectl -n "$NS" logs deploy/frontend --tail=30 || true
      - name: Prueba integrada contra el chat base
        if: env.HAS_KUBECONFIG == 'true'
        run: |
          NS="$NS" CORE_NS="$CORE_NS" bash "$OZY_DIR/k8s/evidencia/flujo-integrado.sh"
          grep -q "FLUJO INTEGRADO OK" "$OZY_DIR"/k8s/evidencia/salida/*-flujo/resumen.txt
      - name: Prueba de escalamiento (HPA)
        if: env.HAS_KUBECONFIG == 'true' && github.event_name == 'workflow_dispatch' && inputs.escalamiento
        run: NS="$NS" bash "$OZY_DIR/k8s/evidencia/escalamiento.sh"
      - name: Guardar evidencia
        if: always() && env.HAS_KUBECONFIG == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: evidencia-ozy-${{ github.run_number }}
          path: demo/ozy/k8s/evidencia/salida/
          if-no-files-found: ignore

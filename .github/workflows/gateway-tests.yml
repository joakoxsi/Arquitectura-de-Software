# Tests de la gateway GraphQL. Solo prueba: no construye imagen ni despliega.
# Va aparte de ozy-k8s.yml para que un cambio en la gateway no redespliegue Ozy.
name: gateway-tests

on:
  push:
    paths:
      - "demo/gateway/**"
      - ".github/workflows/gateway-tests.yml"
  pull_request:
    paths:
      - "demo/gateway/**"
      - ".github/workflows/gateway-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: demo/gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: demo/gateway/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -v
